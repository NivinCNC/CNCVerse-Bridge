name: Commit log

# Posts every push's commits to Discord (#github-logs webhook) and to the "Github Logs"
# topic of the CNCVerse Telegram group, with full commit titles (Discord's built-in
# GitHub webhook cuts them at ~50 characters).
# Secrets: DISCORD_WEBHOOK_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, TELEGRAM_TOPIC_ID.

on:
  push:
    branches: [main]   # commit logs only for main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "Discord secret not set — skipping"; exit 0; fi
          event="$GITHUB_EVENT_PATH"
          [ "$(jq '.commits | length' "$event")" -eq 0 ] && { echo "No commits in this push"; exit 0; }
          # Embed: one line per commit with the full title (newest last, at most 20), whole
          # description kept under Discord's 4096-character limit
          payload=$(jq --arg branch "${GITHUB_REF#refs/heads/}" '
            (.commits | length) as $n
            | ([.commits[-20:][] | "[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0]) — *\(.author.name)*"] | join("\n")) as $lines
            | {
                username: "GitHub",
                embeds: [{
                  title: "[\(.repository.name):\($branch)] \($n) new commit\(if $n == 1 then "" else "s" end)",
                  url: .compare,
                  color: 7506394,
                  author: { name: (.pusher.name // .sender.login), icon_url: .sender.avatar_url },
                  description: (($lines + (if $n > 20 then "\n…and \($n - 20) more" else "" end))[0:4000]),
                  timestamp: (.head_commit.timestamp // null)
                }]
              }' "$event")
          code=$(curl -s -o /tmp/discord.txt -w '%{http_code}' -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK")
          [ "$code" -lt 300 ] || { echo "Discord error $code: $(cat /tmp/discord.txt)"; exit 1; }


      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TOPIC: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram secrets not set — skipping"; exit 0; fi
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          event="$GITHUB_EVENT_PATH"
          repo=$(jq -r '.repository.name' "$event")
          branch="${GITHUB_REF#refs/heads/}"
          pusher=$(jq -r '.pusher.name // .sender.login' "$event")
          compare=$(jq -r '.compare' "$event")
          count=$(jq '.commits | length' "$event")
          [ "$count" -eq 0 ] && { echo "No commits in this push"; exit 0; }
          # One line per commit (first line of the message), newest last, at most 15
          lines=$(jq -r '.commits[-15:][] | "\(.id[0:7])\t\(.url)\t\(.message | split("\n")[0])\t\(.author.name)"' "$event" |
            while IFS=$'\t' read -r sha url msg author; do
              printf '• <a href="%s">%s</a> %s — <i>%s</i>\n' "$url" "$sha" "$(printf '%s' "$msg" | cut -c1-150 | esc)" "$(printf '%s' "$author" | esc)"
            done)
          more=""; [ "$count" -gt 15 ] && more=$'\n'"…and $((count - 15)) more"
          text="🔨 <b>$(printf '%s' "$repo" | esc)</b> · <code>$(printf '%s' "$branch" | esc)</code> — $count commit(s) by $(printf '%s' "$pusher" | esc)"$'\n\n'"$lines$more"$'\n\n'"<a href=\"$compare\">View changes</a>"
          args=(-d chat_id="$TG_CHAT" -d parse_mode=HTML -d disable_web_page_preview=true --data-urlencode "text=$text")
          [ -n "$TG_TOPIC" ] && args+=(-d message_thread_id="$TG_TOPIC")
          resp=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" "${args[@]}")
          echo "$resp" | jq -e '.ok' > /dev/null || { echo "Telegram error: $(echo "$resp" | jq -r '.description')"; exit 1; }
