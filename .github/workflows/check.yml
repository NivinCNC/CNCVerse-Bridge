name: Check

# Compiles the Android and desktop apps and runs the unit tests. Runs on pull requests and by hand
# (Actions tab -> Check -> Run workflow, pick a branch). Nothing is published.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, desktop compile, Android compile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shared:desktopTest :desktopApp:compileKotlinDesktop :androidApp:assembleDebug
