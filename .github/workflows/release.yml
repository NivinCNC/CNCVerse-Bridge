name: Release

# Builds the apps (Android APK, Windows MSI/EXE, Linux DEB) and publishes them as a GitHub release.
#
# Two ways to run it:
#  1. By hand (Actions tab -> Release -> Run workflow). Every release gets a new version: the job bumps
#     version.properties (patch by default: 1.5.9 -> 1.5.10, versionCode +1), turns "## Unreleased" in
#     CHANGELOG.md into "## 1.5.10", commits that to the default branch, tags it v1.5.10, builds from that
#     commit and publishes the release. The in-app update check offers the new version to everyone running
#     an older one.
#  2. By pushing a version tag you made yourself (git tag v1.6.0 && git push origin v1.6.0). The tag must
#     match version.properties, otherwise the app would keep offering an update to itself.
#
# Release notes: the CHANGELOG.md section of the version + the commit list since the previous tag
# (scripts/release-notes.sh). The in-app update dialog shows them.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increase for this release (none = publish the tag given below as it is)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      tag:
        description: "Release tag, only used when the increase is 'none' (e.g. v1.5.10)"
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # by hand: the default branch (the bump is committed there); tag push: that tag
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
      - name: Work out the version (and bump it for a manual release)
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ github.event.inputs.bump }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^android\.versionName=//p' version.properties | tr -d '[:space:]')"
          if [ "$EVENT" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            # The app compares its own version with the release tag: they must agree
            case "$tag" in
              v${current}|v${current}-d*) ;;
              *) echo "::error::Tag $tag does not match version.properties ($current). Bump version.properties first (scripts/bump-version.sh) or start this workflow by hand."; exit 1 ;;
            esac
            sha="$GITHUB_SHA"
          elif [ "${BUMP:-patch}" = "none" ]; then
            [ -n "$TAG_INPUT" ] || { echo "::error::Increase 'none' needs a tag."; exit 1; }
            tag="$TAG_INPUT"
            sha="$(git rev-parse HEAD)"
          else
            new="$(scripts/bump-version.sh "${BUMP:-patch}")"
            tag="v$new"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists."; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add version.properties CHANGELOG.md
            git commit -m "Release $tag"
            git tag "$tag"
            git push origin "HEAD:refs/heads/$BRANCH" "refs/tags/$tag"
            sha="$(git rev-parse HEAD)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $sha"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "No signing secrets: using the sideload key in ci/"
            base64 -d ci/sideload.jks.b64 > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=release" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || env.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :androidApp:assembleRelease
          mkdir -p out
          apk=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$apk" "out/CNCVerse-Bridge-${TAG}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI and EXE
        shell: bash
        run: |
          ./gradlew --no-daemon :desktopApp:packageReleaseDistributionForCurrentOS
          mkdir -p out
          find desktopApp/build/compose/binaries -name '*.msi' -exec cp {} "out/CNCVerse-Bridge-${TAG}.msi" \;
          find desktopApp/build/compose/binaries -name '*.exe' -exec cp {} "out/CNCVerse-Bridge-${TAG}-setup.exe" \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DEB
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :desktopApp:packageReleaseDeb
          mkdir -p out
          deb=$(find desktopApp/build/compose/binaries -name '*.deb' | head -1)
          cp "$deb" "out/CNCVerse-Bridge-${TAG}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    needs: [prepare, android, windows, linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0   # full history + tags for the changelog
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes (CHANGELOG section + commits since the previous release)
        run: |
          git fetch --tags --force --quiet
          ref="$TAG"; git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || ref="${{ needs.prepare.outputs.sha }}"
          # previous version tag (the rolling "latest" tag is not a version)
          prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$TAG" | while read -r t; do
                   git merge-base --is-ancestor "$t" "$ref" 2>/dev/null && { echo "$t"; break; }
                 done || true)
          scripts/release-notes.sh "$TAG" "${{ github.repository }}" "$prev" "$ref" > notes.md
          echo "Release notes for $TAG (previous: ${prev:-none}):"; cat notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            # The tag already exists: no --target (pinning a commit that changes workflow files
            # needs the workflows permission, which the job token never has → HTTP 403)
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" dist/* --title "CNCVerse Bridge ${TAG}" --notes-file notes.md --verify-tag
            else
              # Started by hand without a tag: create the tag on the default branch
              gh release create "$TAG" dist/* --title "CNCVerse Bridge ${TAG}" --notes-file notes.md --target "${{ github.event.repository.default_branch }}"
            fi
          fi
      - name: Announce on Discord and Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TOPIC: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          url="https://github.com/${GH_REPO}/releases/tag/${TAG}"
          dl="https://github.com/${GH_REPO}/releases/download/${TAG}"
          apk="CNCVerse-Bridge-${TAG}.apk"; msi="CNCVerse-Bridge-${TAG}.msi"
          exe="CNCVerse-Bridge-${TAG}-setup.exe"; deb="CNCVerse-Bridge-${TAG}_amd64.deb"
          if [ -n "$DISCORD_WEBHOOK" ]; then
            payload=$(jq -n --arg tag "$TAG" --arg url "$url" --arg dl "$dl" --arg apk "$apk" --arg msi "$msi" --arg exe "$exe" --arg deb "$deb" \
              --arg repo "https://github.com/${GH_REPO}" '{
              content: null,
              embeds: [{
                title: "🚀 CNCVerse Bridge \($tag)",
                description: "Choose your platform below to download the latest release.",
                url: $url,
                color: 1122867,
                fields: [
                  { name: "📱 Android", value: "[**Download APK**](\($dl)/\($apk))", inline: true },
                  { name: "🪟 Windows", value: "[**MSI Installer**](\($dl)/\($msi))\n[Setup EXE](\($dl)/\($exe))", inline: true },
                  { name: "🐧 Linux", value: "[**Download DEB**](\($dl)/\($deb))", inline: true }
                ],
                author: { name: "CNCVerse • Release Announcement", url: $repo },
                footer: { text: "CNCVerse Bridge • Version \($tag | ltrimstr("v"))" }
              }]
            }')
            curl -sf -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK" || echo "::warning::Discord announcement failed"
          fi
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            text="🚀 <b>CNCVerse Bridge ${TAG} released</b>"$'\n\n'"📱 Android: <a href=\"${dl}/${apk}\">${apk}</a>"$'\n'"🪟 Windows: <a href=\"${dl}/${msi}\">${msi}</a> · <a href=\"${dl}/${exe}\">setup.exe</a>"$'\n'"🐧 Linux: <a href=\"${dl}/${deb}\">${deb}</a>"$'\n\n'"<a href=\"${url}\">Release notes</a>"
            args=(-d chat_id="$TG_CHAT" -d parse_mode=HTML -d disable_web_page_preview=true --data-urlencode "text=$text")
            [ -n "$TG_TOPIC" ] && args+=(-d message_thread_id="$TG_TOPIC")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" "${args[@]}" | jq -e '.ok' >/dev/null || echo "::warning::Telegram announcement failed"
          fi
