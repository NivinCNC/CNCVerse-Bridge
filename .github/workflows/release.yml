name: Release

# Builds the apps (Android APK, Windows MSI/EXE, Linux DEB) and publishes them as a
# GitHub release. Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0)
# or by hand from the Actions tab.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :androidApp:assembleRelease
          mkdir -p out
          apk=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$apk" "out/CNCVerse-Bridge-${TAG}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI and EXE
        shell: bash
        run: |
          ./gradlew --no-daemon :desktopApp:packageReleaseDistributionForCurrentOS
          mkdir -p out
          find desktopApp/build/compose/binaries -name '*.msi' -exec cp {} "out/CNCVerse-Bridge-${TAG}.msi" \;
          find desktopApp/build/compose/binaries -name '*.exe' -exec cp {} "out/CNCVerse-Bridge-${TAG}-setup.exe" \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DEB
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :desktopApp:packageReleaseDeb
          mkdir -p out
          deb=$(find desktopApp/build/compose/binaries -name '*.deb' | head -1)
          cp "$deb" "out/CNCVerse-Bridge-${TAG}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for the changelog
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes (changelog since the previous release)
        run: |
          git fetch --tags --force --quiet
          ref="$TAG"; git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || ref="${{ github.sha }}"
          prev=$(git describe --tags --abbrev=0 "${ref}^" 2>/dev/null || true)
          range="${prev:+$prev..}$ref"
          {
            echo "## Downloads"
            echo "- **Android:** \`CNCVerse-Bridge-${TAG}.apk\`"
            echo "- **Windows:** \`CNCVerse-Bridge-${TAG}.msi\` (or \`CNCVerse-Bridge-${TAG}-setup.exe\`)"
            echo "- **Linux (Debian/Ubuntu):** \`CNCVerse-Bridge-${TAG}_amd64.deb\`"
            echo
            echo "## Changelog${prev:+ since $prev}"
            git log --no-merges --pretty='- %s (%h)' "$range"
            [ -n "$prev" ] && { echo; echo "**Full diff:** https://github.com/${{ github.repository }}/compare/${prev}...${TAG}"; }
          } > notes.md
          echo "$(grep -c '^- .*([0-9a-f]\{7,\})$' notes.md) commit(s) in the changelog"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_DEBUG: api   # temporary: show why release creation is refused
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "CNCVerse Bridge ${TAG}" --notes-file notes.md --target "${{ github.sha }}"
          fi
      - name: Announce on Discord and Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TOPIC: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          url="https://github.com/${GH_REPO}/releases/tag/${TAG}"
          dl="https://github.com/${GH_REPO}/releases/download/${TAG}"
          apk="CNCVerse-Bridge-${TAG}.apk"; msi="CNCVerse-Bridge-${TAG}.msi"
          exe="CNCVerse-Bridge-${TAG}-setup.exe"; deb="CNCVerse-Bridge-${TAG}_amd64.deb"
          if [ -n "$DISCORD_WEBHOOK" ]; then
            payload=$(jq -n --arg tag "$TAG" --arg url "$url" --arg dl "$dl" --arg apk "$apk" --arg msi "$msi" --arg exe "$exe" --arg deb "$deb" \
              --arg repo "https://github.com/${GH_REPO}" '{
              content: null,
              embeds: [{
                title: "🚀 CNCVerse Bridge \($tag)",
                description: "Choose your platform below to download the latest release.",
                url: $url,
                color: 1122867,
                fields: [
                  { name: "📱 Android", value: "[**Download APK**](\($dl)/\($apk))", inline: true },
                  { name: "🪟 Windows", value: "[**MSI Installer**](\($dl)/\($msi))\n[Setup EXE](\($dl)/\($exe))", inline: true },
                  { name: "🐧 Linux", value: "[**Download DEB**](\($dl)/\($deb))", inline: true }
                ],
                author: { name: "CNCVerse • Release Announcement", url: $repo },
                footer: { text: "CNCVerse Bridge • Version \($tag | ltrimstr("v"))" }
              }]
            }')
            curl -sf -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK" || echo "::warning::Discord announcement failed"
          fi
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            text="🚀 <b>CNCVerse Bridge ${TAG} released</b>"$'\n\n'"📱 Android: <a href=\"${dl}/${apk}\">${apk}</a>"$'\n'"🪟 Windows: <a href=\"${dl}/${msi}\">${msi}</a> · <a href=\"${dl}/${exe}\">setup.exe</a>"$'\n'"🐧 Linux: <a href=\"${dl}/${deb}\">${deb}</a>"$'\n\n'"<a href=\"${url}\">Release notes</a>"
            args=(-d chat_id="$TG_CHAT" -d parse_mode=HTML -d disable_web_page_preview=true --data-urlencode "text=$text")
            [ -n "$TG_TOPIC" ] && args+=(-d message_thread_id="$TG_TOPIC")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" "${args[@]}" | jq -e '.ok' >/dev/null || echo "::warning::Telegram announcement failed"
          fi
